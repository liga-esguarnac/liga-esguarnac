<script>
    
// Bandoleros. Función para cargar y dibujar la tabla
// Bandoleros. Función para cargar y dibujar la tabla con filtro
function ordenarTabla(criterio) {
    const selectOrden = document.getElementById('ordenar-por');
    if (selectOrden) {
        selectOrden.value = criterio;
        cargarJugadores();
    }
}

// 1. CARGAR, FILTRAR Y ORDENAR BATEADORES
async function cargarJugadores() {
    try {
        const respuesta = await fetch('https://liga-esguarnac.onrender.com/api/bateadores', { cache: 'no-store' });
        let datosCrudos = await respuesta.json();
        
        let datos = [];
        if (datosCrudos !== null) {
            if (Array.isArray(datosCrudos)) {
                // Guardamos el índice exacto de Firebase (idFirebase) antes de filtrar
                datosCrudos.forEach((item, idx) => {
                    if (item !== null && typeof item === 'object') {
                        datos.push({ ...item, idFirebase: idx });
                    }
                });
            } else {
                Object.entries(datosCrudos).forEach(([key, item]) => {
                    if (item !== null && typeof item === 'object') {
                        datos.push({ ...item, idFirebase: key });
                    }
                });
            }
        }

        // Pre-calculamos AVG y SLG para poder ordenar por ellos
        datos.forEach(jugador => {
            jugador.tb = parseInt(jugador.tb) || 0;
            jugador.h = parseInt(jugador.h) || 0;
            jugador.d2b = parseInt(jugador.d2b) || 0;
            jugador.d3b = parseInt(jugador.d3b) || 0;
            jugador.hr = parseInt(jugador.hr) || 0;
            jugador.bb = parseInt(jugador.bb) || 0;
            jugador.ci = parseInt(jugador.ci) || 0;
            jugador.ca = parseInt(jugador.ca) || 0;
            jugador.k = parseInt(jugador.k) || 0;

            jugador.avg = 0.000;
            jugador.slg = 0.000;
            if (jugador.tb > 0) {
                jugador.avg = jugador.h / jugador.tb;
                let sencillos = jugador.h - jugador.d2b - jugador.d3b - jugador.hr;
                let basesTotales = sencillos + (jugador.d2b * 2) + (jugador.d3b * 3) + (jugador.hr * 4);
                jugador.slg = basesTotales / jugador.tb;
            }
        });

        // 1. Filtro Global por Equipo
        const selectFiltro = document.getElementById('filtro-equipo');
        const equipoSeleccionado = selectFiltro ? selectFiltro.value : 'Todos';
        if (equipoSeleccionado !== "Todos") {
            datos = datos.filter(j => (j.equipo || '').trim() === equipoSeleccionado.trim());
        }

        // 2. Ordenar Bateadores
        const selectOrden = document.getElementById('ordenar-por');
        const criterioOrden = selectOrden ? selectOrden.value : 'h';
        if (criterioOrden !== 'defecto') {
            datos.sort((a, b) => (parseFloat(b[criterioOrden]) || 0) - (parseFloat(a[criterioOrden]) || 0));
        }

        if (equipoSeleccionado === "Todos" || equipoSeleccionado === "Todos los equipos") {
            datos = datos.slice(0, 5);
        }
        const tabla = document.getElementById('tabla-jugadores');
        if (!tabla) return;
        tabla.innerHTML = '';

        datos.forEach(jugador => {
            const fila = `<tr>
                <td>${jugador.nombre || 'Sin nombre'}</td>
                <td>${jugador.equipo || '-'}</td>
                <td>${jugador.tb}</td>
                <td>${jugador.h}</td>
                <td>${jugador.d2b}</td>
                <td>${jugador.d3b}</td>
                <td>${jugador.hr}</td>
                <td>${jugador.bb}</td>
                <td>${jugador.ci}</td>
                <td>${jugador.ca}</td>
                <td>${jugador.k}</td>
                <td><strong>${jugador.avg.toFixed(3)}</strong></td>
                <td><strong>${jugador.slg.toFixed(3)}</strong></td>
                <td class="admin-solo">
                    <button style="background-color: #ff9800; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; margin-right: 5px;" onclick="modificarJugador(${jugador.idFirebase}, '${jugador.nombre}', '${jugador.equipo}')">Editar</button>
                    <button style="background-color: #d32f2f; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer;" onclick="eliminarJugador(${jugador.idFirebase}, '${jugador.nombre}')">Borrar</button>
                </td>
            </tr>`;
            tabla.innerHTML += fila;
        });

        if (typeof aplicarModoAdmin === 'function') aplicarModoAdmin();

    } catch (error) {
        console.error("Error cargando bateadores:", error);
    }
}

// Warriors N. Función para registrar jugador
async function agregarJugador() {
    const payload = {
        nombre: document.getElementById('nombre').value,
        equipo: document.getElementById('equipo').value,
        tb: parseInt(document.getElementById('tb').value) || 0,
        h: parseInt(document.getElementById('h').value) || 0,
        d2b: parseInt(document.getElementById('d2b').value) || 0,
        d3b: parseInt(document.getElementById('d3b').value) || 0,
        hr: parseInt(document.getElementById('hr').value) || 0,
        bb: parseInt(document.getElementById('bb').value) || 0,
        ci: parseInt(document.getElementById('ci').value) || 0,
        ca: parseInt(document.getElementById('ca').value) || 0,
        k: parseInt(document.getElementById('k').value) || 0
    };

    if(!payload.nombre) { 
        alert("Por favor, ingresa el nombre"); return; 
    }

    try {
        // CAMBIO CLAVE: Cambiamos /api/registrar por /api/bateadores
        await fetch('https://liga-esguarnac.onrender.com/api/bateadores', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const inputs = document.querySelectorAll('input[type="number"], input[type="text"]');
        inputs.forEach(input => input.value = '');

async function cargarPitchers() {
    try {
        const respuesta = await fetch('https://liga-esguarnac.onrender.com/api/pitchers', { cache: 'no-store' });
        let datosCrudos = await respuesta.json();

        let datos = [];
        if (datosCrudos !== null) {
            if (Array.isArray(datosCrudos)) {
                datosCrudos.forEach((item, idx) => {
                    if (item !== null && typeof item === 'object') {
                        datos.push({ ...item, idFirebase: idx });
                    }
                });
            } else {
                Object.entries(datosCrudos).forEach(([key, item]) => {
                    if (item !== null && typeof item === 'object') {
                        datos.push({ ...item, idFirebase: key });
                    }
                });
            }
        }

        // Pre-calculamos los números y el ERA antes de ordenar
// Pre-calculamos los números, outs reales y el ERA exacto antes de ordenar
        datos.forEach(pitcher => {
            let ipCrudo = parseFloat(pitcher.ip) || 0;
            let entradasEnteras = Math.floor(ipCrudo);
            let outsSueltos = Math.round((ipCrudo - entradasEnteras) * 10);
            
            // Por si hay algún dato antiguo con .3 o más, lo convertimos a entradas reales
            entradasEnteras += Math.floor(outsSueltos / 3);
            outsSueltos = outsSueltos % 3;

            pitcher.ip = parseFloat(`${entradasEnteras}.${outsSueltos}`);
            pitcher.outsTotales = (entradasEnteras * 3) + outsSueltos;

            pitcher.k  = parseInt(pitcher.k) || 0;
            pitcher.cl = parseInt(pitcher.cl) || 0;
            pitcher.cs = parseInt(pitcher.cs) || 0;
            pitcher.g  = parseInt(pitcher.g) || 0;
            pitcher.p  = parseInt(pitcher.p) || 0;

            // ERA oficial = (Carreras Limpias * 27 outs) / Outs Totales lanzados
            pitcher.era = 0.00;
            if (pitcher.outsTotales > 0) {
                pitcher.era = (pitcher.cl * 27.0) / pitcher.outsTotales;
            }
        });

        // 1. Filtro Global por Equipo
        const selectFiltro = document.getElementById('filtro-equipo');
        const equipoSeleccionado = selectFiltro ? selectFiltro.value : 'Todos';
        if (equipoSeleccionado !== "Todos") {
            datos = datos.filter(p => (p.equipo || '').trim() === equipoSeleccionado.trim());
        }

        // 2. Ordenamiento de Pitchers
        const selectOrden = document.getElementById('ordenar-pitchers');
        const criterio = selectOrden ? selectOrden.value : 'defecto';

        if (criterio !== 'defecto') {
            if (criterio === 'era') {
                // ERA: de MENOR a MAYOR (quienes tienen 0 IP van al final)
                datos.sort((a, b) => {
                    if (a.ip === 0 && b.ip > 0) return 1;
                    if (b.ip === 0 && a.ip > 0) return -1;
                    return a.era - b.era;
                });
            } else {
                // Resto de estadísticas (IP, K, G, P, CL, CS): de MAYOR a MENOR
                datos.sort((a, b) => (parseFloat(b[criterio]) || 0) - (parseFloat(a[criterio]) || 0));
            }
        }

        const tabla = document.getElementById('tabla-pitchers');
        if (!tabla) return;
        tabla.innerHTML = '';

        datos.forEach(pitcher => {
            const fila = `<tr>
                <td>${pitcher.nombre || 'Sin nombre'}</td>
                <td>${pitcher.equipo || '-'}</td>
                <td>${pitcher.ip}</td>
                <td>${pitcher.k}</td>
                <td>${pitcher.cl}</td>
                <td>${pitcher.cs}</td>
                <td>${pitcher.g}</td>
                <td>${pitcher.p}</td>
                <td><strong>${pitcher.era.toFixed(2)}</strong></td>
                <td class="admin-solo">
                    <button style="background-color: #ff9800; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; margin-right: 5px;" onclick="modificarPitcher('${pitcher.idFirebase}', '${pitcher.nombre}', '${pitcher.equipo}')">Editar</button>
                    <button style="background-color: #d32f2f; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer;" onclick="eliminarPitcher('${pitcher.idFirebase}', '${pitcher.nombre}')">Borrar</button>
                </td>
            </tr>`;
            tabla.innerHTML += fila;
        });

        if (typeof aplicarModoAdmin === 'function') aplicarModoAdmin();

    } catch (error) {
        console.error("Error cargando pitchers:", error);
    }
}

async function cargarEquipos() {

let equipoAEditar = ""; // Variable para recordar a quién estamos editando

function prepararEdicion(nombre, jg, jp, je, cf, cc) {
    equipoAEditar = nombre;
    
    // Llenamos las cajas automáticamente con los números actuales
    document.getElementById('eq-jg').value = jg;
    document.getElementById('eq-jp').value = jp;
    document.getElementById('eq-je').value = je;
    document.getElementById('eq-cf').value = cf;
    document.getElementById('eq-cc').value = cc;
    
    alert(`Datos de ${nombre} listos.\nModifica los números en las cajas y luego presiona "Guardar Edición".`);
}

async function guardarEdicion() {
    if (equipoAEditar === "") {
        alert("Primero haz clic en 'Editar' en algún equipo de la tabla.");
        return;
    }
    
    const payload = {
        nombre: equipoAEditar,
        jg: parseInt(document.getElementById('eq-jg').value) || 0,
        jp: parseInt(document.getElementById('eq-jp').value) || 0,
        je: parseInt(document.getElementById('eq-je').value) || 0,
        cf: parseInt(document.getElementById('eq-cf').value) || 0,
        cc: parseInt(document.getElementById('eq-cc').value) || 0
    };

    try {
        const response = await fetch('https://liga-esguarnac.onrender.com/api/editar_equipo', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            alert("Equipo sobrescrito correctamente.");
            equipoAEditar = ""; // Limpiamos la memoria
            
            // Limpiamos las cajas
            document.getElementById('eq-jg').value = '';
            document.getElementById('eq-jp').value = '';
            document.getElementById('eq-je').value = '';
            document.getElementById('eq-cf').value = '';
            document.getElementById('eq-cc').value = '';
            
            await cargarEquipos(); // Recargar tabla
        } else {
            alert("Error al editar el equipo.");
        }
    } catch (error) {
        console.error(error);
    }
}
